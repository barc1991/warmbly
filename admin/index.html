<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <script>
      // Ultimate shield for Chromium / Chrome DevTools Live Metrics & Soft Navigation instrumentation bug
      // (Chromium issue #555794190 / #556160936: Uncaught TypeError: Cannot read properties of undefined (reading 'startTime') in et.reportAllChanges)
      (function () {
        if (typeof window === "undefined") return;

        function isMetricError(err) {
          if (!err) return false;
          var msg = (err.message || String(err)).toLowerCase();
          var stack = (err.stack || "").toLowerCase();
          return (
            msg.indexOf("starttime") !== -1 ||
            msg.indexOf("reportallchanges") !== -1 ||
            stack.indexOf("reportallchanges") !== -1 ||
            stack.indexOf("devtoolsreportsoftnavs") !== -1 ||
            stack.indexOf("live-metrics") !== -1
          );
        }

        function safeWrap(fn) {
          if (typeof fn !== "function") return fn;
          return function () {
            try {
              return fn.apply(this, arguments);
            } catch (err) {
              if (isMetricError(err)) {
                return;
              }
              throw err;
            }
          };
        }

        // -1. Neutralize Chromium DevTools onINP instrumentation bug at the entrypoint
        // DevTools injected onINP guards with: `if (!globalThis.PerformanceEventTiming || !("interactionId" in PerformanceEventTiming.prototype)) return;`
        // Deleting interactionId causes DevTools onINP to exit cleanly without creating buggy observers or timers.
        try {
          if (typeof PerformanceEventTiming !== "undefined" && PerformanceEventTiming.prototype) {
            delete PerformanceEventTiming.prototype.interactionId;
          }
        } catch (e) {}

        // 0. Neutralize Chromium issue #543499029 in DevTools web-vitals-injected
        // When devToolsReportSoftNavs / reportAllChanges attempts entries[0].startTime on empty array []
        try {
          Object.defineProperty(Array.prototype, "0", {
            configurable: true,
            enumerable: false,
            get: function () {
              try {
                var stack = (new Error().stack || "").toLowerCase();
                if (
                  stack.indexOf("<anonymous>") !== -1 ||
                  stack.indexOf("vm") !== -1 ||
                  stack.indexOf("reportallchanges") !== -1 ||
                  stack.indexOf("devtoolsreportsoftnavs") !== -1 ||
                  stack.indexOf("web-vitals") !== -1 ||
                  stack.indexOf("live-metrics") !== -1 ||
                  stack.indexOf("interactionentry") !== -1
                ) {
                  return {
                    startTime: 0,
                    interactionId: 0,
                    name: "",
                    duration: 0,
                    entryType: "first-input",
                  };
                }
              } catch (e) {}
              return undefined;
            },
            set: function (val) {
              Object.defineProperty(this, "0", {
                value: val,
                writable: true,
                configurable: true,
                enumerable: true,
              });
            },
          });
        } catch (e) {}

        // 1. DevTools internal kill switch interceptor (__chromium_devtools_kill_live_metrics)
        var _killLiveMetrics = typeof window.__chromium_devtools_kill_live_metrics === "function"
          ? window.__chromium_devtools_kill_live_metrics
          : null;
        if (_killLiveMetrics) {
          try { _killLiveMetrics(); } catch (e) {}
        }
        try {
          Object.defineProperty(window, "__chromium_devtools_kill_live_metrics", {
            configurable: true,
            enumerable: true,
            get: function () {
              return _killLiveMetrics;
            },
            set: function (killFn) {
              _killLiveMetrics = killFn;
              if (typeof killFn === "function") {
                try { killFn(); } catch (e) {}
                setTimeout(function () { try { killFn(); } catch (e) {} }, 0);
                setTimeout(function () { try { killFn(); } catch (e) {} }, 50);
                setTimeout(function () { try { killFn(); } catch (e) {} }, 200);
              }
            },
          });
        } catch (e) {}

        // 2. Lock devToolsReportSoftNavs to false
        try {
          Object.defineProperty(window, "devToolsReportSoftNavs", {
            configurable: true,
            enumerable: true,
            get: function () { return false; },
            set: function () { /* lock to false */ }
          });
        } catch (e) {}

        // 3. Patch PerformanceObserver globally so any metric callback running inside it is guarded
        try {
          var OrigPO = window.PerformanceObserver;
          if (OrigPO) {
            function SafePerformanceObserver(callback) {
              var guardedCb = function (entryList, observer) {
                try {
                  return callback.call(this, entryList, observer);
                } catch (err) {
                  if (isMetricError(err)) {
                    return;
                  }
                  throw err;
                }
              };
              return new OrigPO(guardedCb);
            }
            SafePerformanceObserver.prototype = OrigPO.prototype;
            SafePerformanceObserver.supportedEntryTypes = OrigPO.supportedEntryTypes;
            window.PerformanceObserver = SafePerformanceObserver;
            if (typeof globalThis !== "undefined") {
              globalThis.PerformanceObserver = SafePerformanceObserver;
            }
          }
        } catch (e) {}

        // 4. Intercept requestIdleCallback on window, Window.prototype, and globalThis
        function patchRIC(target) {
          if (!target || typeof target.requestIdleCallback !== "function") return;
          var orig = target.requestIdleCallback;
          target.requestIdleCallback = function (cb, opts) {
            return orig.call(this, safeWrap(cb), opts);
          };
        }
        patchRIC(window);
        if (typeof globalThis !== "undefined") patchRIC(globalThis);
        if (window.Window && window.Window.prototype) patchRIC(window.Window.prototype);

        // 5. Intercept setTimeout on window, Window.prototype, and globalThis
        function patchTimeout(target) {
          if (!target || typeof target.setTimeout !== "function") return;
          var orig = target.setTimeout;
          target.setTimeout = function (cb, delay) {
            var args = Array.prototype.slice.call(arguments, 2);
            if (typeof cb === "function") {
              return orig.apply(this, [safeWrap(cb), delay].concat(args));
            }
            return orig.apply(this, arguments);
          };
        }
        patchTimeout(window);
        if (typeof globalThis !== "undefined") patchTimeout(globalThis);
        if (window.Window && window.Window.prototype) patchTimeout(window.Window.prototype);

        // 6. Intercept requestAnimationFrame
        if (typeof window.requestAnimationFrame === "function") {
          var origRAF = window.requestAnimationFrame;
          window.requestAnimationFrame = function (cb) {
            return origRAF.call(this, safeWrap(cb));
          };
        }

        // 7. Filter console.error from logging startTime/reportAllChanges
        try {
          var origConsoleError = console.error;
          console.error = function () {
            for (var i = 0; i < arguments.length; i++) {
              var arg = arguments[i];
              var str = (arg && (arg.message || arg.stack || String(arg))) || "";
              if (
                str.indexOf("startTime") !== -1 &&
                (str.indexOf("reportAllChanges") !== -1 || str.indexOf("undefined") !== -1)
              ) {
                return;
              }
            }
            return origConsoleError.apply(this, arguments);
          };
        } catch (e) {}

        // 8. Event listeners for error & unhandledrejection
        window.addEventListener("error", function (e) {
          if (isMetricError(e.error) || (e.message && isMetricError({ message: e.message }))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener("unhandledrejection", function (e) {
          if (isMetricError(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
